name: Release

# On a v* tag: image on GHCR, SBOM by Syft, vulnerability gate by Grype,
# then cosign signs the image and attests the SBOM, without a long-lived key.
# Check an image: see "Verify the image" in the README
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Registry names must be lowercase
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Syft is the single SBOM source, attested by cosign below
          sbom: false
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install Syft, Grype and cosign, signatures and checksums verified
        run: |
          scripts/install-tool.sh "$RUNNER_TEMP/bin" syft grype cosign
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: SBOM of the image
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: syft scan "registry:$REF" -o cyclonedx-json=sbom.cdx.json -o spdx-json=sbom.spdx.json
      - name: Gate on fixable high and critical vulnerabilities
        run: grype sbom:sbom.cdx.json --by-cve --only-fixed --fail-on high
      - name: Sign the image and attest the SBOM
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-image
          path: sbom.*.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
