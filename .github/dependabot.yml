version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A fresh release can be a hijacked one: wait a week before proposing it
    cooldown:
      default-days: 7
    # Majors break tooling, typescript-eslint lags behind TypeScript for instance.
    # They come one by one, outside the groups, and need a manual review
    groups:
      nuxt:
        patterns: ['nuxt', '@nuxt/*', 'nitropack', 'vue', 'vue-router']
        update-types: [minor, patch]
      dev:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Types follow the Node major of the runtime image
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Waits for typescript-eslint support of TypeScript 7
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Node LTS only: the next major move is a manual one, to 26
      - dependency-name: node
        update-types: ['version-update:semver-major']
