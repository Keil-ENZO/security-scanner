# Accepted risks for the release gate. Read by Grype in .github/workflows/release.yml.
#
# Policy: only vulnerabilities inside third-party tools of the image, already on their latest
# release, fixed upstream in Go or a library but not shipped by the tool yet. A release inside the
# 7 day cooldown of scripts/update-tools.mjs does not count as latest: a fresh one can be hijacked.
# Each rule names one CVE in one binary: a new CVE in the same binary still fails the gate.
# On every bump of scripts/tools.env, delete the rules of the bumped tool, then rerun the gate.
# scripts/update-tools.mjs does the deletion for the weekly bumps.
# Our own code and dependencies never get an exception here.
#
# Reviewed 2026-11-01, for the versions noted on each block. Every rule still matches the 0.5.2 image.
# CVE-2026-78661 added 2026-11-05: x/net/html parser, quadratic time on crafted HTML, no code execution.
ignore:

  # grype 0.121.0: built with a Go toolchain and modules older than the fixes
  - vulnerability: CVE-2026-56857
    reason: grype 0.121.0 is the latest release, the fix is not shipped upstream yet
    package:
      location: "/usr/local/bin/grype"
