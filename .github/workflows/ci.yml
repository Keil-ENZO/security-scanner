name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: security-scanner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name scanner -e NITRO_HOST=0.0.0.0 -p 127.0.0.1:3003:3003 security-scanner:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3003/api/health && exit 0
            sleep 1
          done
          docker logs scanner
          exit 1
      # Same gate as the release, so a vulnerable image never reaches a tag
      - name: Install Syft and Grype, signatures and checksums verified
        run: |
          scripts/install-tool.sh "$RUNNER_TEMP/bin" syft grype
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Gate the image on fixable high and critical vulnerabilities
        run: |
          syft scan docker:security-scanner:ci -q -o cyclonedx-json=sbom.cdx.json
          grype sbom:sbom.cdx.json --config .grype.yaml --by-cve --only-fixed --fail-on high
